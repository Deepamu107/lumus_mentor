{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Welcome to Lumos Mentor</h1>
    <p class="subtitle">
        An AI mentor that understands how you learn, not just what you score.
    </p>

    <form method="post" class="form">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Subject</label>
        <input type="text" name="subject" value="Algebra" required>

        <button type="submit" class="btn-primary">Start Learning</button>
    </form>
</div>
{% endblock %}
